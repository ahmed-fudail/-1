<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دليل مراكز التكلفة</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <p class="eyebrow">قاعدة بيانات مركزية</p>
          <h1>دليل مراكز التكلفة</h1>
        </div>
        <div class="header-meta">
          <span id="record-count">0</span>
          <small>سجل</small>
        </div>
      </header>

      <section class="summary" id="summary"></section>

      <section class="toolbar">
        <label class="search-box" for="searchInput">
          <span>🔎</span>
          <input
            id="searchInput"
            type="search"
            placeholder="ابحث باسم مركز التكلفة، رقم الحجز، الوصف أو الملاحظات..."
            aria-label="البحث في البيانات"
          />
        </label>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">الكل</button>
          <button class="filter-btn" data-filter="review">تحتاج مراجعة</button>
          <button class="filter-btn" data-filter="non-review">غير مطلوبة</button>
        </div>
      </section>

      <section id="detailPanel" class="detail-panel hidden" aria-live="polite">
        <div class="detail-header">
          <div>
            <p class="eyebrow">تفاصيل المركز</p>
            <h2 id="detailTitle">مركز التكلفة</h2>
          </div>
          <button id="shareBtn" class="share-btn" type="button">مشاركة</button>
        </div>

        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">مركز التكلفة</span>
            <strong id="detailCostCenter">-</strong>
          </div>
          <div class="detail-item">
            <span class="detail-label">رقم الحجز</span>
            <strong id="detailBooking">-</strong>
          </div>
          <div class="detail-item detail-wide">
            <span class="detail-label">تفاصيل العقد</span>
            <strong id="detailContract">-</strong>
          </div>
          <div class="detail-item detail-wide">
            <span class="detail-label">ملاحظات</span>
            <strong id="detailNotes">-</strong>
          </div>
          <div class="detail-item">
            <span class="detail-label">المبلغ</span>
            <strong id="detailAmount">-</strong>
          </div>
          <div class="detail-item">
            <span class="detail-label">الحالة</span>
            <strong id="detailStatus">-</strong>
          </div>
        </div>
      </section>

      <main>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>مركز التكلفة</th>
                <th>رقم الحجز</th>
                <th>تفاصيل العقد</th>
                <th>ملاحظات</th>
                <th>المبلغ (LYD)</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
